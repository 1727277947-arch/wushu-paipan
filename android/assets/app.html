<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五术排盘</title>
<style>
/* 传统文化娱乐 · 五术排盘 样式 */
:root {
  --ink: #1c1917;
  --ink-soft: #44403c;
  --ink-faint: #78716c;
  --paper: #faf8f4;
  --paper-2: #f3efe7;
  --paper-3: #e9e3d6;
  --line: #ddd5c7;
  --line-strong: #c9bfab;
  --cinnabar: #a8342a;
  --cinnabar-soft: #c2564a;
  --gold: #a8853f;
  --jade: #4a6b5d;
  --azure: #3c5a7d;
  --shadow: 0 1px 3px rgba(28,25,23,.06), 0 8px 24px -12px rgba(28,25,23,.18);
  --radius: 10px;
  --font-serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --font-sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* 宣纸质感底纹 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 18% 12%, rgba(168,133,63,.05), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(168,52,42,.04), transparent 46%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(28,25,23,.008) 3px 4px);
}

/* ==================== App 外壳 ==================== */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 1240px;
  margin: 0 auto;
}

/* ---------- 顶栏（紧凑） ---------- */
.appbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 52px;
  padding: 0 14px;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(250, 248, 244, .94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.appbar-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.appbar-mark { flex: 0 0 auto; font-size: 20px; line-height: 1; color: var(--cinnabar); }
.appbar-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .1em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-btn {
  appearance: none;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--paper-2);
  color: var(--ink-soft);
  border-radius: 999px;
  min-height: 34px;
  padding: 0 15px;
  font-size: 12.5px;
  font-family: var(--font-serif);
  letter-spacing: .08em;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.icon-btn:active { background: var(--paper-3); }

/* ---------- 底部导航栏 ---------- */
.tabs {
  flex: 0 0 auto;
  display: flex;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  background: rgba(250, 248, 244, .97);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  appearance: none;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-height: 58px;
  padding: 7px 3px;
  border: none;
  background: none;
  color: var(--ink-faint);
  font-family: var(--font-serif);
  cursor: pointer;
  transition: color .15s;
}
.tab .tab-icon { font-size: 18px; line-height: 1.1; }
.tab .tab-label { font-size: 10.5px; letter-spacing: .04em; }
.tab.active { color: var(--cinnabar); }
.tab.active .tab-icon { transform: translateY(-1px); }
.tab:active .tab-icon { transform: scale(.9); }

/* ---------- 内容区（独立滚动） ---------- */
.content {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px 14px calc(74px + env(safe-area-inset-bottom, 0px));
}

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(28, 25, 23, .04);
  padding: 14px 16px 16px;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.link-btn {
  appearance: none;
  flex: 0 0 auto;
  border: none;
  background: none;
  color: var(--ink-faint);
  font-size: 12.5px;
  font-family: var(--font-serif);
  letter-spacing: .06em;
  padding: 6px 2px;
  cursor: pointer;
}
.link-btn:active { color: var(--cinnabar); }

.panel.collapsed .form-grid,
.panel.collapsed .actions,
.panel.collapsed .hint { display: none; }
.panel.collapsed .panel-head { margin-bottom: 0; }

.foot {
  margin: 4px 0 0;
  text-align: center;
  color: var(--ink-faint);
  font-size: 11px;
  line-height: 1.7;
}

.panel-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--ink);
  padding-left: 11px;
  position: relative;
}
.panel-title::before {
  content: '';
  position: absolute;
  left: 0;
  top: .28em;
  bottom: .28em;
  width: 3px;
  border-radius: 2px;
  background: var(--cinnabar);
}

/* ---------- 更多功能弹层 ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; }
.sheet-mask {
  position: absolute;
  inset: 0;
  background: rgba(28, 25, 23, .34);
  opacity: 0;
  transition: opacity .2s;
}
.sheet-wrap.open .sheet-mask { opacity: 1; }
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--paper);
  border-radius: 16px 16px 0 0;
  padding: 8px 14px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform .24s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -8px 30px -10px rgba(28, 25, 23, .3);
}
.sheet-wrap.open .sheet { transform: translateY(0); }
.sheet-handle {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
  margin: 4px auto 12px;
}
.sheet-title {
  margin: 0 0 10px;
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--ink-faint);
}
.sheet-list { display: flex; flex-direction: column; gap: 8px; }
.sheet-item {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 58px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.sheet-item.active { border-color: var(--cinnabar); background: rgba(168, 52, 42, .05); }
.si-icon {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--paper-2);
  color: var(--cinnabar);
  font-family: var(--font-serif);
  font-size: 16px;
}
.sheet-item.active .si-icon { background: var(--cinnabar); color: #fff; }
.si-text { display: flex; flex-direction: column; min-width: 0; }
.si-text b { font-family: var(--font-serif); font-size: 15px; font-weight: 600; letter-spacing: .06em; }
.si-text i {
  font-style: normal;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .06em;
}

/* ==================== 宽屏：回到普通网页布局 ==================== */
@media (min-width: 760px) {
  .app { height: auto; min-height: 100vh; padding-bottom: 40px; }
  .appbar { min-height: 60px; padding: 0 24px; }
  .appbar-title { font-size: 19px; }

  .tabs {
    position: static;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    background: none;
    backdrop-filter: none;
    border-top: none;
    border-bottom: 1px solid var(--line);
    padding: 0 24px 14px;
  }
  .tab {
    flex: 0 0 auto;
    flex-direction: row;
    gap: 7px;
    min-height: 38px;
    padding: 6px 17px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
    transition: all .16s ease;
  }
  .tab .tab-icon { font-size: 14px; }
  .tab .tab-label { font-size: 14px; letter-spacing: .1em; }
  .tab:hover { border-color: var(--line-strong); color: var(--ink); transform: translateY(-1px); }
  .tab.active {
    background: var(--cinnabar);
    border-color: var(--cinnabar);
    color: #fff;
    box-shadow: 0 4px 14px -6px rgba(168, 52, 42, .6);
  }

  .content { overflow: visible; padding: 22px 24px 0; gap: 22px; }
  .panel { padding: 20px 22px 22px; }
  .panel-title { font-size: 17px; }
  .foot { font-size: 11.5px; }
  .sheet-wrap { display: none; }
}
/* ---------- 表单 ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }

.field label {
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: .1em;
  font-family: var(--font-serif);
}

.field input, .field select {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: var(--font-sans);
  transition: border-color .15s, box-shadow .15s;
  width: 100%;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--cinnabar-soft);
  box-shadow: 0 0 0 3px rgba(168,52,42,.1);
  background: #fff;
}

.seg { display: flex; gap: 6px; }
.seg label {
  flex: 1;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px 0;
  font-size: 14px;
  cursor: pointer;
  background: var(--paper);
  letter-spacing: .08em;
  transition: all .14s;
  font-family: var(--font-serif);
}
.seg input { display: none; }
.seg input:checked + label,
.seg label:has(input:checked) {
  background: var(--cinnabar);
  border-color: var(--cinnabar);
  color: #fff;
}

.actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

.btn {
  appearance: none;
  border-radius: 7px;
  padding: 9px 18px;
  font-size: 14px;
  font-family: var(--font-serif);
  letter-spacing: .1em;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s ease;
}
.btn.primary {
  background: var(--cinnabar);
  color: #fff;
  box-shadow: 0 4px 14px -6px rgba(168,52,42,.55);
}
.btn.primary:hover { background: #932c23; transform: translateY(-1px); }
.btn.ghost { background: var(--paper-2); border-color: var(--line); color: var(--ink-soft); }
.btn.ghost:hover { border-color: var(--line-strong); color: var(--ink); }
.btn.small { padding: 5px 12px; font-size: 12px; }

.hint {
  margin: 12px 0 0;
  font-size: 12px;
  color: var(--ink-faint);
  min-height: 1.2em;
}

/* ---------- 结果区 ---------- */
.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}
.result-head .panel-title { margin-bottom: 0; }

.result-body { min-height: 320px; }

.empty-state { text-align: center; padding: 70px 20px; color: var(--ink-faint); }
.empty-icon { font-size: 54px; color: var(--line-strong); line-height: 1; margin-bottom: 14px; }
.empty-state p { margin: 6px 0; }
.empty-sub { font-size: 12px; letter-spacing: .1em; }

/* 信息条 */
.meta-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  padding: 12px 0 16px;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 16px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12.5px;
  color: var(--ink-soft);
}
.chip b { color: var(--ink); font-weight: 600; font-family: var(--font-serif); }
.chip.accent { background: rgba(168,52,42,.07); border-color: rgba(168,52,42,.28); color: var(--cinnabar); }
.chip.accent b { color: var(--cinnabar); }

/* 区块标题 */
.sec-title {
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: .16em;
  color: var(--ink-soft);
  margin: 22px 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.sec-title:first-child { margin-top: 0; }

/* 四柱大表 */
.pillar-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.pillar-table th, .pillar-table td {
  padding: 9px 8px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
.pillar-table thead th {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--ink-soft);
  background: var(--paper-2);
  border-bottom: 1px solid var(--line-strong);
}
.pillar-table thead th:first-child { border-top-left-radius: 7px; }
.pillar-table thead th:last-child { border-top-right-radius: 7px; }
.pillar-table tbody tr:last-child td { border-bottom: none; }
.pillar-table tbody tr:hover { background: rgba(168,133,63,.05); }
.pillar-table td.rowlabel {
  font-family: var(--font-serif);
  color: var(--ink-faint);
  letter-spacing: .1em;
  font-size: 12.5px;
  text-align: left;
  white-space: nowrap;
}

.ganzhi {
  font-family: var(--font-serif);
  font-size: 24px;
  letter-spacing: .06em;
  line-height: 1.2;
}
.ganzhi .st { color: var(--cinnabar); }
.ganzhi .br { color: var(--azure); }

.wx-木 { color: #3f7d54; }
.wx-火 { color: #b4442f; }
.wx-土 { color: #97733a; }
.wx-金 { color: #9a8b4f; }
.wx-水 { color: #35648f; }

.tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 11.5px;
  border: 1px solid var(--line);
  background: var(--paper-2);
  color: var(--ink-soft);
  font-family: var(--font-serif);
  letter-spacing: .06em;
}
.tag.ten { background: rgba(60,90,125,.08); border-color: rgba(60,90,125,.25); color: var(--azure); }
.tag.shi { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
.tag.ying { background: var(--jade); border-color: var(--jade); color: #fff; }
.tag.move { background: rgba(168,52,42,.1); border-color: rgba(168,52,42,.35); color: var(--cinnabar); }
.tag.kong { background: var(--paper-3); color: var(--ink-faint); text-decoration: line-through; }
.tag.hua { background: linear-gradient(135deg, #b3452f, #8d3520); color: #fff; border-color: transparent; }
.tag.dun { background: rgba(168,133,63,.12); border-color: rgba(168,133,63,.35); color: var(--gold); }

/* 五行力量条 */
.wx-bars { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.wx-bar { display: grid; grid-template-columns: 26px 1fr 52px; align-items: center; gap: 10px; font-size: 12.5px; }
.wx-bar .wx-name { font-family: var(--font-serif); font-size: 15px; text-align: center; }
.wx-bar .track { height: 8px; background: var(--paper-3); border-radius: 999px; overflow: hidden; }
.wx-bar .fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.wx-bar .pct { text-align: right; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.fill-木 { background: linear-gradient(90deg, #5f9c72, #3f7d54); }
.fill-火 { background: linear-gradient(90deg, #d4664c, #b4442f); }
.fill-土 { background: linear-gradient(90deg, #c0a068, #97733a); }
.fill-金 { background: linear-gradient(90deg, #c4b678, #9a8b4f); }
.fill-水 { background: linear-gradient(90deg, #6b93b8, #35648f); }

/* 大运 */
.luck-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; }
.luck-item {
  flex: 0 0 auto;
  min-width: 62px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 6px;
  background: var(--paper);
  transition: all .16s;
}
.luck-item:hover { border-color: var(--cinnabar-soft); transform: translateY(-2px); }
.luck-item .age { font-size: 11px; color: var(--ink-faint); }
.luck-item .gz { font-family: var(--font-serif); font-size: 17px; margin: 2px 0; }
.luck-item .yr { font-size: 10.5px; color: var(--ink-faint); }

/* 卦象 */
.gua-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: start; }
.gua-col { min-width: 0; }
.gua-head { text-align: center; margin-bottom: 10px; }
.gua-name { font-family: var(--font-serif); font-size: 19px; letter-spacing: .1em; }
.gua-sub { font-size: 11.5px; color: var(--ink-faint); letter-spacing: .08em; }
.gua-arrow { align-self: center; font-size: 22px; color: var(--line-strong); }

.yao-list { display: flex; flex-direction: column-reverse; gap: 5px; }
.yao {
  display: grid;
  grid-template-columns: 74px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  font-size: 12.5px;
  transition: all .15s;
}
.yao:hover { background: #fff; border-color: var(--line-strong); }
.yao.is-shi { border-color: rgba(168,52,42,.5); background: rgba(168,52,42,.05); }
.yao.is-ying { border-color: rgba(74,107,93,.45); background: rgba(74,107,93,.05); }
.yao.is-moving { box-shadow: inset 3px 0 0 var(--cinnabar); }
.yao .y-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.yao .y-gz { font-family: var(--font-serif); font-size: 14px; letter-spacing: .06em; }
.yao .y-meta { font-size: 10.5px; color: var(--ink-faint); }
.yao .y-tags { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.symbol-lines { display: flex; flex-direction: column-reverse; gap: 4px; width: 62px; }
.symbol-lines .line { height: 8px; display: flex; gap: 6px; }
.symbol-lines .line i { flex: 1; background: var(--ink); border-radius: 2px; }
.symbol-lines .line.yin i { background: transparent; }
.symbol-lines .line.yin i:first-child,
.symbol-lines .line.yin i:last-child { background: var(--ink); flex: 0 0 calc(50% - 3px); }

.text-block {
  background: var(--paper-2);
  border-left: 3px solid var(--gold);
  border-radius: 0 7px 7px 0;
  padding: 12px 16px;
  font-family: var(--font-serif);
  font-size: 14px;
  line-height: 1.9;
  color: var(--ink-soft);
  letter-spacing: .05em;
}

/* 九宫格 */
.qimen-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.qm-cell {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
  background: var(--paper);
  min-height: 112px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: all .16s;
}
.qm-cell:hover { border-color: var(--line-strong); background: #fff; }
.qm-cell.center { background: var(--paper-2); }
.qm-cell.is-zhifu { border-color: rgba(168,52,42,.5); box-shadow: inset 0 0 0 1px rgba(168,52,42,.15); }
.qm-cell.is-zhishi { border-color: rgba(74,107,93,.5); }
.qm-top { display: flex; justify-content: space-between; align-items: baseline; }
.qm-palace { font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; }
.qm-dir { font-size: 10.5px; color: var(--line-strong); }
.qm-stars { display: flex; gap: 6px; align-items: baseline; font-family: var(--font-serif); }
.qm-star { font-size: 15px; color: var(--azure); }
.qm-door { font-size: 15px; color: var(--jade); }

  gap: 3px;
  font-size: 12px;
  transition: all .16s;
}
.zw-cell:hover { background: #fff; border-color: var(--line-strong); }

/* 天地盘 */
.plate-wrap { overflow-x: auto; }
.plate {
  display: grid;
  grid-template-columns: 92px repeat(12, minmax(42px, 1fr));
  gap: 4px;
  min-width: 660px;
  font-size: 12px;
}
.plate .p-label {
  font-family: var(--font-serif);
  color: var(--ink-faint);

  align-items: center;
  letter-spacing: .06em;
  white-space: nowrap;
}
.plate .p-cell {
  text-align: center;

.plate .p-head { background: var(--paper-2); color: var(--ink-soft); font-size: 12px; }

.foot {

  line-height: 1.7;

@media print {

    });
    const qi = palaces.filter((p) => p.skyStem && SANQI[p.skyStem]).map((p) => `${p.skyStem}（${SANQI[p.skyStem]}）在${p.name}${p.direction}`);
    out.push({
      title: "四、三奇落在哪",
      text: (qi.length ? `三奇是乙、丙、丁，奇门里看作最灵的三样，走到哪儿哪儿就带贵气。这一局：${qi.join("；")}。要办大事、要找人帮忙，往三奇所在的方位去，比别处顺。` : "这一局三奇不显，属于平常之局，按常规来就行。") + "另外九星也各管一路：" + [...new Set(palaces.map((p) => p.star))].slice(0, 9).map((s) => STAR_QI[s] ? `${s}${STAR_QI[s]}` : "").filter(Boolean).slice(0, 4).join("；") + "。"
    });
    out.push({
      title: "五、给个总的说法",
      text: `这一局是${q.juName}，值符${q.zhifuStar}、值使${q.zhishiDoor}。` + (good.length ? `要用事，挑${good[0].door}所在的${good[0].direction}方位，${good[0].god ? `那个宫还配着${good[0].god}，` : ""}是这一局最顺的地方。` : "") + "奇门跟别的术数不一样：它不主要用来「算」，主要是用来「用」——同一个时辰，方位选对了就顺，选错了就顶。所以叫择时择方。真要拿它办事，还得细看用神落宫、门星神的组合，这里给的是大方向。"
    });

  }
